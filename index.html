<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enigma</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="maquina">
        <h1>ENIGMA</h1>
        <p class="dica">Clique nas teclas ou use o teclado do computador.</p>

        <div class="janelas">
            <input type="text" id="j0" maxlength="1" value="A">
            <input type="text" id="j1" maxlength="1" value="A">
            <input type="text" id="j2" maxlength="1" value="A">
        </div>
        <div id="lampada"></div>
        <div id="teclado"></div>

        <p class="rotulo">ENTRADA (o que você digitou)</p>
        <div class="linha" id="entrada"></div>
        <p class="rotulo">SAÍDA (as lâmpadas que acendem)</p>
        <div class="linha" id="saída"></div>
        <p class="rotulo">CAMINHO DA ÚLTIMA LETRA</p>
        <div class="linha" id="caminho"></div>

        <button class="acao" id="btnReiniciar">Reiniciar Rotores e Mensagem</button>
    </div>
</body>

</html>
